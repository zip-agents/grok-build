# Both jobs run inside images built from this repo. See README.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint, types, and tests inside the dev image
        env:
          # Pull requests diff against the base commit. Pushes diff against
          # the previous tip. An empty value compares against origin/main.
          COVERAGE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make check

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the runtime image and smoke-test it
        run: make image-smoke IMAGE=zip-service:ci DEV_IMAGE=zip-service:ci-check GIT_SHA=${{ github.sha }}
